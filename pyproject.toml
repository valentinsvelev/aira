[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aira"
version = "0.1.0"
description = "AIRA: a local, retrieval-augmented AI research assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Valentin Velev"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pypdf>=5,<8",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "llama-index-core>=0.12,<0.16",
  "llama-index-retrievers-bm25>=0.5,<0.11",
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "httpx>=0.27,<1",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
web = ["ddgs>=9.13,<11", "trafilatura>=2.0,<3"]
local = ["langchain-ollama>=0.3,<2", "sentence-transformers>=3,<6"]
analytics = ["duckdb>=1.3,<2"]
reranking = ["torch>=2.4,<3", "transformers>=4.51,<6", "sentence-transformers>=3,<6", "accelerate>=1.0,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
observability = ["opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2", "opentelemetry-exporter-otlp-proto-http>=1.28,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.9,<1", "alembic>=1.14,<2"]

[project.scripts]
aira = "aira.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: validates installed LlamaIndex retrieval integration"]
# SQLite connections from short-lived test apps are closed by the garbage collector.
filterwarnings = ["ignore:unclosed database:ResourceWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The codebase favours compact one-line statements; long lines are not enforced.
ignore = ["E501", "E701", "E702", "E731", "B008", "B905"]

[tool.coverage.run]
source = ["src/aira"]
branch = true

[tool.coverage.report]
skip_empty = true
