name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.dev.yml config -q
          docker compose -f compose.yml -f compose.dev.yml -f compose.vllm.yml config -q
          docker compose -f compose.yml -f compose.dev.yml -f compose.airflow.yml config -q
          docker compose -f compose.yml -f compose.analytics.yml config -q
          docker compose -f compose.demo.yml config -q
      - name: Preflight
        run: python scripts/preflight.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: aira
          POSTGRES_PASSWORD: ci_only_local_password
          POSTGRES_DB: aira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aira -d aira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://aira:ci_only_local_password@localhost:5432/aira
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,postgres,observability,web]'
      - name: Check Alembic migrations against PostgreSQL
        run: |
          DATABASE_URL="$TEST_POSTGRES_URL" alembic upgrade head
          DATABASE_URL="$TEST_POSTGRES_URL" alembic check
      - name: Run tests with coverage (no model server needed)
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
